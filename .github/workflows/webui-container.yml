name: WebUI Container Build & Deploy

# Trigger workflow on push to main/develop or PR
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'webui/Dockerfile*'
      - 'docker-compose-webui*.yml'
      - '.github/workflows/webui-container.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'webui/Dockerfile*'
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ttrpg-webui
  DOCKERFILE: webui/Dockerfile.optimized

jobs:

  # ==============================================
  # Job 1: Build and Test
  # ==============================================
  build-and-test:
    name: Build & Test Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup pnpm for caching
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.10.0

      # Setup Node.js with caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Setup Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest

      # Login to GitHub Container Registry
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for Docker tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build Docker image (testing stage for validation)
      - name: Build Docker image (testing stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: testing
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          outputs: type=docker,dest=/tmp/test-image.tar

      # Build production image
      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          target: runner
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Save image artifact for security scanning
      - name: Save image for scanning
        if: github.event_name == 'pull_request'
        run: docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test -o /tmp/image.tar

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1


  # ==============================================
  # Job 2: Security Scanning
  # ==============================================
  security-scan:
    name: Security Scan (Trivy & Grype)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/image.tar

      # Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Grype vulnerability scanner
      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v3
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test'
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}


  # ==============================================
  # Job 3: SBOM Generation
  # ==============================================
  sbom-generation:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate SBOM using Syft
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest'
          format: 'cyclonedx-json'
          output-file: 'sbom-webui.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-webui
          path: sbom-webui.json
          retention-days: 90

      # Attach SBOM to release (if tagged)
      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: sbom-webui.json


  # ==============================================
  # Job 4: Image Signing (Cosign)
  # ==============================================
  sign-image:
    name: Sign Container Image with Cosign
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sign the container image using keyless mode
      - name: Sign the container image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # Verify signature
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp=".*" \
            --certificate-oidc-issuer-regexp=".*" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


  # ==============================================
  # Job 5: Deploy to Staging
  # ==============================================
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.ttrpg-center.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploy to staging (customize based on your infrastructure)
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # Examples:
          # - kubectl apply -f k8s/staging/
          # - docker-compose -f docker-compose-webui-enhanced.yml --profile staging up -d
          # - SSH deployment scripts

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # Add Playwright smoke tests here
          # npx playwright test --config=playwright.config.staging.ts


  # ==============================================
  # Job 6: Deploy to Production
  # ==============================================
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan, sbom-generation, sign-image]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ttrpg-center.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Production deployment with approval gate (configured in GitHub settings)
      - name: Deploy to production server
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment script here
          # Examples:
          # - kubectl apply -f k8s/production/
          # - docker-compose -f docker-compose-webui-enhanced.yml --profile production up -d
          # - Blue-green deployment scripts

      - name: Health check
        run: |
          echo "Running health checks..."
          curl -f https://ttrpg-center.example.com/api/health || exit 1

      - name: Send deployment notification
        if: success()
        run: |
          echo "Deployment successful! Sending notification..."
          # Add Slack/Discord/Email notification here


  # ==============================================
  # Job 7: Cleanup
  # ==============================================
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'ttrpg-webui'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
