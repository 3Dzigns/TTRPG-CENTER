name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Black
        run: black --check --diff .

      - name: Run isort
        run: isort --check-only --diff .

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src_common/

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run unit tests
        run: pytest tests/unit -v --cov=src_common --cov-report=xml --junitxml=reports/unit-tests.xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-report
          path: reports/unit-tests.xml

  functional-tests:
    runs-on: ubuntu-latest
    name: Functional Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run functional tests
        run: pytest tests/functional -v --junitxml=reports/functional-tests.xml

      - name: Upload functional test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: functional-test-report
          path: reports/functional-tests.xml

  security-tests:
    runs-on: ubuntu-latest
    name: Security Tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r src_common/ -f json -o bandit-report.json

      - name: Upload Bandit findings
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run security tests
        run: pytest tests/security -v --tb=short

  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: |
          pip install twine
          twine check dist/*

  semgrep-scan:
    runs-on: ubuntu-latest
    name: Semgrep Scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/ci
        env:
          SEMGREP_RULES_SOURCES: 'p/ci'

  trivy-scan:
    runs-on: ubuntu-latest
    name: Trivy Security Scan
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.21.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

  zap-baseline:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Launch user API for scanning
        run: |
          uvicorn services.user_api.api:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Run ZAP Baseline
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://127.0.0.1:8000/docs'
          cmd_options: '--auto'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
