# ==============================================
# TTRPG Center WebUI - Enhanced Docker Compose
# ==============================================
#
# Features:
# - Multiple deployment profiles (development, staging, production)
# - Security hardening (read-only root, no-new-privileges, capabilities drop)
# - Resource limits and reservations
# - Structured logging with rotation
# - Health checks and dependency management
# - Development hot-reload support
#
# Usage:
#   Development:  docker-compose -f docker-compose-webui-enhanced.yml --profile development up
#   Staging:      docker-compose -f docker-compose-webui-enhanced.yml --profile staging up
#   Production:   docker-compose -f docker-compose-webui-enhanced.yml --profile production up
#
# ==============================================

version: '3.9'

services:

  # ==============================================
  # Development Profile - Hot Reload Enabled
  # ==============================================
  webui-dev:
    profiles: ["development"]
    build:
      context: .
      dockerfile: webui/Dockerfile.optimized
      target: development
      cache_from:
        - type=registry,ref=ttrpg-webui:dev-cache
    image: ttrpg-webui:dev
    container_name: ttrpg_webui_dev
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Node environment
      - NODE_ENV=development
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1

      # API Base URLs (internal Docker network)
      - API_BASE_URL=http://n8n_TTRPG_n8n:5678
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9000

      # Database URLs (internal Docker network)
      - MONGODB_URI=mongodb://n8n_TTRPG_mongodb:27017/ttrpg_dev
      - NEO4J_URI=bolt://n8n_TTRPG_neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CASSANDRA_CONTACT_POINTS=n8n_TTRPG_cassandra:9042

      # Service URLs (internal Docker network)
      - STARGATE_URL=http://n8n_TTRPG_stargate:8082
      - LANGFLOW_URL=http://n8n_TTRPG_langflow:7860
      - HAYHOOKS_URL=http://n8n_TTRPG_hayhooks:8000
      - UNSTRUCTURED_URL=http://n8n_TTRPG_unstructured:8000

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Development debugging
      - DEBUG=*
      - NEXT_PUBLIC_DEBUG=true

      # Timezone
      - TZ=America/Chicago

    env_file:
      - .env

    # Hot-reload volumes for development
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/.next
      - /app/apps/web/node_modules

    # Resource limits (relaxed for development)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - n8n_TTRPG_network

    depends_on:
      n8n:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # ==============================================
  # Staging Profile - Production-like Build
  # ==============================================
  webui-staging:
    profiles: ["staging"]
    build:
      context: .
      dockerfile: webui/Dockerfile.optimized
      target: runner
      cache_from:
        - type=registry,ref=ttrpg-webui:staging-cache
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ttrpg-webui:staging
    container_name: ttrpg_webui_staging
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1

      # API Base URLs (internal Docker network)
      - API_BASE_URL=http://n8n_TTRPG_n8n:5678
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9000

      # Database URLs (internal Docker network - staging databases)
      - MONGODB_URI=mongodb://n8n_TTRPG_mongodb:27017/ttrpg_staging
      - NEO4J_URI=bolt://n8n_TTRPG_neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CASSANDRA_CONTACT_POINTS=n8n_TTRPG_cassandra:9042

      # Service URLs (internal Docker network)
      - STARGATE_URL=http://n8n_TTRPG_stargate:8082
      - LANGFLOW_URL=http://n8n_TTRPG_langflow:7860
      - HAYHOOKS_URL=http://n8n_TTRPG_hayhooks:8000
      - UNSTRUCTURED_URL=http://n8n_TTRPG_unstructured:8000

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Timezone
      - TZ=America/Chicago

    env_file:
      - .env

    # Resource limits (moderate for staging)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # External health check (distroless has no curl)
    # Configure external monitoring instead

    networks:
      - n8n_TTRPG_network

    depends_on:
      n8n:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false  # Next.js needs write access to .next cache
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "env=staging"


  # ==============================================
  # Production Profile - Maximum Security & Performance
  # ==============================================
  webui-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: webui/Dockerfile.optimized
      target: runner
      cache_from:
        - type=registry,ref=ttrpg-webui:prod-cache
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ttrpg-webui:latest
    container_name: ttrpg_webui_prod
    restart: always

    ports:
      - "3000:3000"

    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1

      # API Base URLs (use production endpoints)
      - API_BASE_URL=http://n8n_TTRPG_n8n:5678
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:9000}

      # Database URLs (production databases)
      - MONGODB_URI=${MONGODB_URI}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CASSANDRA_CONTACT_POINTS=${CASSANDRA_CONTACT_POINTS}

      # Service URLs
      - STARGATE_URL=${STARGATE_URL}
      - LANGFLOW_URL=${LANGFLOW_URL}
      - HAYHOOKS_URL=${HAYHOOKS_URL}
      - UNSTRUCTURED_URL=${UNSTRUCTURED_URL}

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Timezone
      - TZ=${TZ:-America/Chicago}

    env_file:
      - .env

    # Resource limits (strict for production)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # External health check (distroless has no curl)
    # Use external monitoring service (Prometheus, etc.)

    networks:
      - n8n_TTRPG_network

    depends_on:
      n8n:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    # Maximum security hardening
    security_opt:
      - no-new-privileges:true
    read_only: false  # Next.js standalone needs temp write
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only if binding to port <1024

    # Logging with structured format
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        labels: "env=production,service=webui"
        tag: "{{.Name}}/{{.ID}}"


# ==============================================
# Networks
# ==============================================
networks:
  n8n_TTRPG_network:
    external: true
    driver: bridge


# ==============================================
# Volumes (optional - for future caching)
# ==============================================
volumes:
  webui-next-cache:
    driver: local
  webui-node-modules:
    driver: local
