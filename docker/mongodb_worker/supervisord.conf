[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# MongoDB Upsert Worker
[program:pass_a_mongo_upsert]
command=python3 pass_a_mongo_upsert_worker.py --jobs-dir /Transfer_Station/jobs --log-dir /Transfer_Station/Logs --poll-interval 5
directory=/opt/workers
autostart=true
autorestart=true
startretries=10
startsecs=30
stderr_logfile=/Transfer_Station/Logs/pass_a_mongo_upsert/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/pass_a_mongo_upsert/supervisor_stdout.log
