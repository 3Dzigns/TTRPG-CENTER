# RabbitMQ Configuration for TTRPG Ingestion Pipeline
# Extended consumer timeout for long-running document processing tasks

# Consumer timeout: 24 hours (86400000 milliseconds)
# Must match or exceed Celery TASK_HARD_TIME_LIMIT
# Default is 30 minutes (1800000 ms) which causes timeouts for large PDF processing
consumer_timeout = 86400000

# Management plugin
management.tcp.port = 15672
