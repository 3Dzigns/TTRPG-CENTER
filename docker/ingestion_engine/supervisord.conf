[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Gate 0 Workers - Entry & Validation
[program:gate_0_hash]
command=python3 gate_0_hash_worker.py --jobs-dir /Transfer_Station/jobs --log-dir /Transfer_Station/Logs --poll-interval 5
directory=/Transfer_Station/scripts
autostart=true
autorestart=true
startretries=10
stderr_logfile=/Transfer_Station/Logs/gate_0_hash/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/gate_0_hash/supervisor_stdout.log
priority=100

[program:gate_0_validate]
command=python3 gate_0_validate_worker.py --jobs-dir /Transfer_Station/jobs --log-dir /Transfer_Station/Logs --poll-interval 5
directory=/Transfer_Station/scripts
autostart=true
autorestart=true
startretries=10
stderr_logfile=/Transfer_Station/Logs/gate_0_validate/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/gate_0_validate/supervisor_stdout.log
priority=101

[program:doc_splitter]
command=python3 doc_splitter_worker.py --jobs-dir /Transfer_Station/jobs --log-dir /Transfer_Station/Logs --poll-interval 5
directory=/Transfer_Station/scripts
autostart=true
autorestart=true
startretries=10
stderr_logfile=/Transfer_Station/Logs/doc_splitter/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/doc_splitter/supervisor_stdout.log
priority=102

# Pass A Worker - Metadata
[program:pass_a_metadata]
command=python3 pass_a_metadata_worker.py --jobs-dir /Transfer_Station/jobs --log-dir /Transfer_Station/Logs --poll-interval 5
directory=/Transfer_Station/scripts
autostart=true
autorestart=true
startretries=10
stderr_logfile=/Transfer_Station/Logs/pass_a_metadata/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/pass_a_metadata/supervisor_stdout.log
priority=200

# Gate 1 Workers - Quality & Cleanup
# Source Monitor - Auto-Discovery (waits 60s for other workers to be healthy)
[program:source_monitor]
command=python3 source_monitor_worker.py --sources-dir /Transfer_Station/sources --manifest-path /Transfer_Station/Logs/source_monitor/manifest.json --poll-interval 300
directory=/Transfer_Station/scripts
autostart=true
autorestart=true
startretries=10
startsecs=60
stderr_logfile=/Transfer_Station/Logs/source_monitor/supervisor_stderr.log
stdout_logfile=/Transfer_Station/Logs/source_monitor/supervisor_stdout.log
priority=999
