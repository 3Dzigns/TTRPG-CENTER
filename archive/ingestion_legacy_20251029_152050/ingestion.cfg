# Ingestion Pipeline Configuration
# =================================
# Central configuration for all ingestion passes.
# Modify these values to customize pipeline behavior without editing code.

[Gate_0]
# File validation and hash computation
output_dir = /Transfer_Station/Gate_0_Out

# Rebuild mode settings (v2.2.0)
# rebuild_mode: Enable document-specific DB cleanup before upserting (default: true)
# rebuild_scope: Comma-separated list of databases to rebuild (default: mongodb,cassandra,neo4j)
rebuild_mode = true
rebuild_scope = mongodb,cassandra,neo4j

[Pass_A]
# Document extraction and TOC metadata
output_dir = /Transfer_Station/Pass_A_Out

# Unstructured.io API settings
unstructured_strategy = hi_res
ocr_language = eng

# TOC extraction settings (used with doc_splitter to create TOC file)
toc_start_page = 1
toc_end_page = 8

# MongoDB settings
mongo_host = n8n_TTRPG_mongodb
mongo_port = 27017
mongo_db = ttrpg_ingestion

[Pass_B]
# Document splitting into logical parts
output_dir = /Transfer_Station/Pass_B_Out

# Page range for logical parts
# min_pages: Minimum pages per part (prevents tiny splits)
# max_pages: Maximum pages per part (prevents huge parts)
min_pages = 10
max_pages = 15

[Pass_C]
# Full document processing and metadata extraction
input_dir = /Transfer_Station/Pass_C_Out
output_dir = /Transfer_Station/Pass_C_Out

# Game system and publisher detection
# Use 'auto' for automatic detection from document content
game_system = auto
publisher = auto

# MongoDB settings
mongo_host = n8n_TTRPG_mongodb
mongo_port = 27017
mongo_db = ttrpg_ingestion

[Pass_D]
# Vector embedding generation and storage
output_dir = /Transfer_Station/Pass_D_Out

# Cassandra settings
cassandra_host = n8n_TTRPG_cassandra
cassandra_port = 9042
cassandra_keyspace = ttrpg_vectors

# OpenAI embedding settings
embedding_model = text-embedding-3-small

# Character-based chunking settings (fine-grained semantic chunks)
# min_chunk_chars: Minimum characters per chunk
# max_chunk_chars: Maximum characters per chunk
# chunk_overlap: Overlap between consecutive chunks for context continuity
min_chunk_chars = 500
max_chunk_chars = 600
chunk_overlap = 50

# Batch processing
batch_size = 100

[Pass_E]
# Knowledge graph construction from vectors and metadata
output_dir = /Transfer_Station/Pass_E_Out

# Cassandra settings (for vector retrieval)
cassandra_host = n8n_TTRPG_cassandra
cassandra_port = 9042
cassandra_keyspace = ttrpg_vectors
# Cassandra batching controls
cassandra_fetch_size = 500
cassandra_max_retries = 3

# Neo4j settings
neo4j_host = n8n_TTRPG_neo4j
neo4j_port = 7687
neo4j_database = neo4j

# Similarity edge settings (optional SIMILAR_TO relationships)
# enable_similarity: Create SIMILAR_TO edges between semantically similar chunks
# similarity_threshold: Minimum cosine similarity (0.0-1.0) to create edge
# similarity_top_k: Maximum similar chunks per chunk (caps edge count)
enable_similarity = false
similarity_threshold = 0.82
similarity_top_k = 5

# LlamaIndex settings (future enhancement)
llamaindex_url = http://n8n_TTRPG_llamaindex:8000

