# docker-compose-webui.yml
# WebUI Container for TTRPG Center
# Separate from ingestion engine - contains ONLY the Next.js frontend

services:
  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: n8n_ttrpg_webui:latest
    container_name: n8n_TTRPG_webui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Node environment
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1

      # API Base URLs (internal Docker network)
      - API_BASE_URL=http://n8n_TTRPG_n8n:5678
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9000

      # Database URLs (internal Docker network)
      - MONGODB_URI=mongodb://n8n_TTRPG_mongodb:27017/ttrpg
      - NEO4J_URI=bolt://n8n_TTRPG_neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CASSANDRA_CONTACT_POINTS=n8n_TTRPG_cassandra:9042

      # Service URLs (internal Docker network)
      - STARGATE_URL=http://n8n_TTRPG_stargate:8082
      - LANGFLOW_URL=http://n8n_TTRPG_langflow:7860
      - HAYHOOKS_URL=http://n8n_TTRPG_hayhooks:8000
      - UNSTRUCTURED_URL=http://n8n_TTRPG_unstructured:8000

      # OpenAI API
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # Timezone
      - TZ=America/Chicago

    env_file:
      - .env

    # Volume mount for development hot-reload (comment out in production)
    # volumes:
    #   - ./apps/web:/app/apps/web
    #   - ./packages:/app/packages
    #   - /app/node_modules
    #   - /app/apps/web/.next

    # Health check disabled for distroless image (no shell utilities)
    # Application is accessible on port 3000 - monitor via external checks
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

    networks:
      - n8n_TTRPG_network

    # Dependencies removed - connect to existing network only
    # External services already running in n8n_TTRPG_network

# Use existing network from docker-compose-n8n_TTRPG.yml
networks:
  n8n_TTRPG_network:
    external: true
