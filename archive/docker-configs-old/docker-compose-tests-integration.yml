version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5679:5672"
      - "15679:15672"
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ttrpg
      POSTGRES_PASSWORD: ttrpg
      POSTGRES_DB: ttrpg_ingestion
    ports:
      - "55433:5432"
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: ttrpg_cluster
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
      CASSANDRA_LISTEN_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_ADDRESS: 127.0.0.1
      CASSANDRA_RPC_ADDRESS: 0.0.0.0
      CASSANDRA_BROADCAST_RPC_ADDRESS: 127.0.0.1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NATIVE_TRANSPORT_PORT: 39042
    ports:
      - "39042:39042"
  neo4j:
    image: neo4j:5-enterprise
    environment:
      NEO4J_AUTH: neo4j/testing
      NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
    ports:
      - "7748:7474"
      - "7769:7687"
