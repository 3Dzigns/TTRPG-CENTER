# Example container-with-2 pipeline definition
# Adjust to match your orchestration platform; this assumes a generic YAML runner
# that launches a fixed Docker image and executes shell commands.

version: 1
name: container-with-2-build
runner:
  image: ghcr.io/container-with-2/default:latest
  shell: /bin/bash
  env:
    TTRPG_REGISTRY: ghcr.io/ttrpg-center
    TTRPG_ENVIRONMENTS: "dev test"
    TTRPG_PUSH: "true"
steps:
  - name: Checkout
    run: |
      git clone "$CI_REPO" repo
      cd repo
      git checkout "$CI_REF"

  - name: Login to registry
    run: |
      echo "$CI_REGISTRY_PASSWORD" | docker login "$TTRPG_REGISTRY" --username "$CI_REGISTRY_USERNAME" --password-stdin
    secrets:
      - CI_REGISTRY_USERNAME
      - CI_REGISTRY_PASSWORD

  - name: Build + Push Immutable Images
    run: |
      cd repo
      chmod +x scripts/ci/container-build.sh
      chmod +x scripts/registry/check-compose-no-build.sh
      scripts/ci/container-build.sh

  - name: Produce lock artifacts
    run: |
      cd repo
      ls env/*/images.lock || true
      cp env/dev/images.lock "$CI_ARTIFACTS/dev.images.lock"
      cp env/test/images.lock "$CI_ARTIFACTS/test.images.lock"
      cp env/prod/images.lock "$CI_ARTIFACTS/prod.images.lock"
    artifacts:
      paths:
        - dev.images.lock
        - test.images.lock
        - prod.images.lock

  - name: Run unit tests
    run: |
      cd repo
      python -m pip install --upgrade pip
      pip install -e .[dev]
      pytest tests/unit -q
