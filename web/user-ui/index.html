<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTRPG Center - User Interface</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Antonio:wght@100..700&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Terminal scan line effect */
      .terminal-screen::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(to right, transparent, #00ff41, transparent);
        animation: scan-line 2s linear infinite;
        z-index: 1000;
        pointer-events: none;
      }

      /* LCARS panel styling */
      .lcars-panel {
        background: linear-gradient(135deg, #ff9f00 0%, #cc6600 100%);
        border-radius: 0 20px 20px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
