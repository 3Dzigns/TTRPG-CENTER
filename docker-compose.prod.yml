version: '3.8'

networks:
  ttrpg-prod:
    driver: bridge
    name: ttrpg-prod-network

services:
  cassandra:
    image: cassandra:5
    container_name: ttrpg-cassandra-prod
    environment:
      CASSANDRA_CLUSTER_NAME: ttrpg-prod
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    ports:
      - "9044:9042"
    volumes:
      - ./env/prod/data/cassandra:/var/lib/cassandra
    networks:
      ttrpg-prod:
        aliases:
          - cassandra-prod
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ttrpg-redis-prod
    command: redis-server --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - ./env/prod/data/redis:/data
    networks:
      ttrpg-prod:
        aliases:
          - redis-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ttrpg-mongo-prod
    ports:
      - "27019:27017"
    volumes:
      - ./env/prod/data/mongo:/data/db
    networks:
      ttrpg-prod:
        aliases:
          - mongo-prod
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: ingest
    container_name: ttrpg-ingest-prod
    working_dir: /app
    env_file:
      - ./env/prod/config/.env
    environment:
      TARGET_ENV: prod
      SERVICE_NAME: ingest
      PORT: "8285"
    volumes:
      - ./:/app
      - ./env/prod/data:/app/env/prod/data
      - ./env/prod/logs:/app/env/prod/logs
      - ./env/prod/artifacts:/app/env/prod/artifacts
      - ./env/prod/cache:/app/env/prod/cache
      - ./env/prod/uploads:/app/env/prod/uploads
      - ./env/prod/ssl:/app/env/prod/ssl
    networks:
      - ttrpg-prod
    depends_on:
      cassandra:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8285:8285"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: orchestrator
    container_name: ttrpg-orchestrator-prod
    working_dir: /app
    env_file:
      - ./env/prod/config/.env
    environment:
      TARGET_ENV: prod
      SERVICE_NAME: orchestrator
      PORT: "8286"
    volumes:
      - ./:/app
      - ./env/prod/logs:/app/env/prod/logs
      - ./env/prod/cache:/app/env/prod/cache
    networks:
      - ttrpg-prod
    depends_on:
      ingest:
        condition: service_started
    ports:
      - "8286:8286"
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: admin_api
    container_name: ttrpg-admin-api-prod
    working_dir: /app
    env_file:
      - ./env/prod/config/.env
    environment:
      TARGET_ENV: prod
      SERVICE_NAME: admin_api
      PORT: "8283"
    volumes:
      - ./:/app
      - ./env/prod/data:/app/env/prod/data
      - ./env/prod/logs:/app/env/prod/logs
      - ./env/prod/artifacts:/app/env/prod/artifacts
      - ./env/prod/uploads:/app/env/prod/uploads
    networks:
      - ttrpg-prod
    depends_on:
      cassandra:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_started
    ports:
      - "8283:8283"
    restart: unless-stopped

  user-api:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: user_api
    container_name: ttrpg-user-api-prod
    working_dir: /app
    env_file:
      - ./env/prod/config/.env
    environment:
      TARGET_ENV: prod
      SERVICE_NAME: user_api
      PORT: "8284"
    volumes:
      - ./:/app
      - ./env/prod/logs:/app/env/prod/logs
      - ./env/prod/cache:/app/env/prod/cache
    networks:
      - ttrpg-prod
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "8284:8284"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    container_name: ttrpg-app-prod
    working_dir: /app
    env_file:
      - ./env/prod/config/.env
    environment:
      TARGET_ENV: prod
      SERVICE_NAME: app
      PORT: "8282"
    volumes:
      - ./:/app
      - ./env/prod/logs:/app/env/prod/logs
      - ./env/prod/cache:/app/env/prod/cache
      - ./env/prod/uploads:/app/env/prod/uploads
    networks:
      - ttrpg-prod
    depends_on:
      admin-api:
        condition: service_started
      user-api:
        condition: service_started
      orchestrator:
        condition: service_started
    ports:
      - "8282:8282"
    restart: unless-stopped
