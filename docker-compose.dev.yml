version: '3.8'

networks:
  ttrpg-dev:
    driver: bridge
    name: ttrpg-dev-network

services:
  cassandra:
    image: cassandra:5
    container_name: ttrpg-cassandra-dev
    environment:
      CASSANDRA_CLUSTER_NAME: ttrpg-dev
      CASSANDRA_DC: dc1
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - ./env/dev/data/cassandra:/var/lib/cassandra
    networks:
      - ttrpg-dev
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ttrpg-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./env/dev/data/redis:/data
    networks:
      - ttrpg-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: ttrpg-mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - ./env/dev/data/mongo:/data/db
    networks:
      - ttrpg-dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: ingest
    container_name: ttrpg-ingest-dev
    working_dir: /app
    env_file:
      - ./env/dev/config/.env
    environment:
      TARGET_ENV: dev
      SERVICE_NAME: ingest
      PORT: "8003"
    volumes:
      - ./:/app
      - ./env/dev/data:/app/env/dev/data
      - ./env/dev/logs:/app/env/dev/logs
      - ./env/dev/artifacts:/app/env/dev/artifacts
      - ./env/dev/cache:/app/env/dev/cache
      - ./env/dev/uploads:/app/env/dev/uploads
      - ./env/dev/ssl:/app/env/dev/ssl
    networks:
      - ttrpg-dev
    depends_on:
      cassandra:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: orchestrator
    container_name: ttrpg-orchestrator-dev
    working_dir: /app
    env_file:
      - ./env/dev/config/.env
    environment:
      TARGET_ENV: dev
      SERVICE_NAME: orchestrator
      PORT: "8004"
    volumes:
      - ./:/app
      - ./env/dev/logs:/app/env/dev/logs
      - ./env/dev/cache:/app/env/dev/cache
    networks:
      - ttrpg-dev
    depends_on:
      ingest:
        condition: service_started
    ports:
      - "8004:8004"
    restart: unless-stopped

  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: admin_api
    container_name: ttrpg-admin-api-dev
    working_dir: /app
    env_file:
      - ./env/dev/config/.env
    environment:
      TARGET_ENV: dev
      SERVICE_NAME: admin_api
      PORT: "8001"
    volumes:
      - ./:/app
      - ./env/dev/data:/app/env/dev/data
      - ./env/dev/logs:/app/env/dev/logs
      - ./env/dev/artifacts:/app/env/dev/artifacts
      - ./env/dev/uploads:/app/env/dev/uploads
    networks:
      - ttrpg-dev
    depends_on:
      cassandra:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_started
    ports:
      - "8001:8001"
    restart: unless-stopped

  user-api:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE_NAME: user_api
    container_name: ttrpg-user-api-dev
    working_dir: /app
    env_file:
      - ./env/dev/config/.env
    environment:
      TARGET_ENV: dev
      SERVICE_NAME: user_api
      PORT: "8002"
    volumes:
      - ./:/app
      - ./env/dev/logs:/app/env/dev/logs
      - ./env/dev/cache:/app/env/dev/cache
    networks:
      - ttrpg-dev
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "8002:8002"
    restart: unless-stopped

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test-runner
    container_name: ttrpg-test-runner-dev
    working_dir: /app
    env_file:
      - ./env/dev/config/.env
    environment:
      TARGET_ENV: dev
      TEST_RUNNER_PORT: "8095"
    volumes:
      - ./:/app
      - ./env/dev/logs:/app/env/dev/logs
      - ./env/dev/artifacts:/app/env/dev/artifacts
      - ./env/dev/cache:/app/env/dev/cache
    networks:
      - ttrpg-dev
    depends_on:
      admin-api:
        condition: service_started
      user-api:
        condition: service_started
    ports:
      - "8095:8095"
    restart: unless-stopped
    profiles:
      - testing
