[tool:pytest]
# TTRPG Center Test Configuration for External Test Execution
# Supports MVP v2 Test Console with multi-environment targeting

# Test discovery patterns
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version requirement
minversion = 7.0

# Add src_common to Python path for imports
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --color=yes
    --durations=10
    --cov=src_common
    --cov-report=html:env/dev/logs/coverage
    --cov-report=term-missing
    --cov-fail-under=80
    --json-report
    --json-report-summary

# Register custom markers for test suite types
markers =
    unit: Unit tests - fast, isolated component tests
    functional: Functional tests - API and UI workflow tests
    security: Security tests - SAST/DAST and vulnerability scans
    regression: Regression tests - golden snapshots and eval sets
    perf: Performance tests - load testing and benchmarks
    external: External execution mode - run via Test Console
    dev: Development environment tests
    test: Test environment tests
    prod: Production environment tests
    slow: Slow running tests (>5 seconds)
    integration: Integration tests requiring external services
    cassandra: Cassandra backend tests

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning:cassandra.*
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Test timeout (prevents hanging tests)
timeout = 300
timeout_method = thread

# Environment variables for test execution
env =
    PYTEST_CURRENT_TEST = true
    EXTERNAL_TEST_MODE = false
    CI = false

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = env/dev/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src_common
branch = true
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = env/dev/logs/coverage
