[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttrpg-center"
version = "2.0.0"
description = "AI-powered platform for tabletop RPG content management and intelligent query handling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.6",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.9",
    "pre-commit>=3.8.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

# Black formatting configuration (88 columns as per coding standards)
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude environment directories
  env
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | __pycache__
)/
'''

# Ruff linting configuration
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "env/",
    ".git/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".venv/",
    "__pycache__/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C901", # cyclomatic complexity
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # complexity check (will be enforced at ≤10)
]

[tool.ruff.lint.mccabe]
max-complexity = 10  # Coding standards requirement

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "F811"]  # Allow longer lines and unused imports in tests

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["src_common"]

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "unstructured.*",
    "haystack.*",
    "llama_index.*",
    "openai.*",
    "anthropic.*",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "regression: marks tests as regression tests",
    "security: marks tests as security tests",
    "functional: marks tests as functional tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src_common"]
omit = [
    "*/tests/*",
    "*/test_*",
    "env/*",
    ".venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]